    #runecrafting-planner .rcp-empty { color:var(--rcp-muted); padding:12px 0; }
    #runecrafting-planner .rcp-warning { color:#fde68a; font-size:.82rem; margin-top:10px; }
    #runecrafting-planner .rcp-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    #runecrafting-planner .rcp-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    #runecrafting-planner .rcp-tag { display:inline-block; border:1px solid var(--rcp-line); border-radius:999px; padding:3px 8px; font-size:.75rem; color:var(--rcp-muted); }
    /* Adaptive desktop width up to 1600px; phone layout preserved from V6. */
    @media (max-width:640px) {
      #runecrafting-planner { width:100%; max-width:100%; min-width:0; }

      #runecrafting-planner h2 { font-size:1.45rem; }

    #runecrafting-planner .rcp-review-actions { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 4px; }

    #runecrafting-planner .rcp-review-enchant-title { font-weight:700; color:#f7f4fa; }

      #runecrafting-planner .rcp-review-actions .rcp-button { width:100%; min-height:44px; }

      #runecrafting-planner .rcp-build-review-head .rcp-button { min-height:44px; }

/* Content Overview shared theme */
:root{--bg:#090a10;--card:#171923;--field:#11121b;--line:#343342;--text:#f7f4fa;--muted:#b8b5c5;--pink:#e96aa9;--accent:#c48aff;color-scheme:dark}
html{background:var(--bg)}body{background:var(--bg);color:var(--text);font:15px/1.6 "Atkinson Hyperlegible",Verdana,Arial,sans-serif}
button,input,select,textarea{font-family:inherit}button,a,summary{touch-action:manipulation}
button,input,select,textarea{min-height:42px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent)!important;outline-offset:3px}
h1{font-size:clamp(28px,3.5vw,40px);line-height:1.15;letter-spacing:-.035em}h2,h3{letter-spacing:-.025em;line-height:1.3}
.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.16em;font-weight:800}
main,.wrap{max-width:none}main{padding:22px 20px 40px}body:has(>.wrap){padding:22px 20px 40px}
.panel,.controls,.card{border-radius:14px}.panel{box-shadow:0 12px 32px #00000012}
.menu{background:#20222e}.empty{background:#11121b}.status,footer{color:var(--muted);font-size:12px}
.pill,.tag,.chip,.rune-chip{border-color:#61546d}.pill.pink,.source{color:#ffb2d7}
.groupbtn.active,.itembtn.active,.level[aria-pressed=true],.btn.pink,.load,.result button{color:#240e1c;font-weight:800}
.itembtn.active small{color:#240e1c}.btn.pink:hover,.load:hover,.result button:hover{background:#ffb2d7}
@media(max-width:600px){main{padding:18px 12px 30px}body:has(>.wrap){padding:18px 12px 30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

onlet dodge chance\n- Haste: +0.25❤️ moonlet impact damage\n- Tenacity: +0.5 blocks moonlet knockback\n- Vigor: +0.5❤️ per moonlet\n\n- Eclipse: The behavior of the eclipsed object is replaced while wearing this Aphelion.","source":"Runecrafted","category":"Aphelion","costMode":"runes"},{"name":"Aphelion of Uranus","runes":["Echoes","Tides","Chills","Kinesis","Mortus"],"items":["Boots"],"maxLevel":1,"incompatible":[],"description":"Eclipses Howling. Your Howl instead requires 7 stacks and intiates an icy riptide, freezing enemies you pass through for 2 seconds and striking for 75% damage. If your offhand is Howling, it also strikes for 25% damage.\n- Eclipse: The behavior of the eclipsed object is replaced while wearing this Aphelion.","source":"Runecrafted","category":"Aphelion","costMode":"runes"},{"name":"Aphelion of Venus","runes":["Cinders","Chills","Mortus","Gusts","Moments"],"items":["Boots"],"maxLevel":1,"incompatible":[],"description":"Eclipses Fire, Ice, and Plague Aspect. Applying those effects instead adds them to your atmosphere for 8 seconds.\n- Eclipse: The behavior of the eclipsed object is replaced while wearing this Aphelion.\n- Atmosphere: Enemies gain your atmosphere's effects only while within it. Its radius starts at 2 blocks and grows by 1 block every other attack.","source":"Runecrafted","category":"Aphelion","costMode":"runes"},{"name":"Avalanche","runes":["Kinesis","Gusts","Chills","Kinesis","Chills"],"items":["Maces"],"maxLevel":1,"incompatible":["Ragnarok","Resonance","Will-o'-Wisp"],"description":"Upon ascending to the maximum height from this mace's boosting enchantment, it releases a sheet of ice which falls forward onto targets below, dealing 4♥️ freezing damage and 8 seconds of frostbite.","source":"Runecrafted","category":"Radial","costMode":"runes"},{"name":"Avatar of Bats","runes":["Gusts","Vitality","Void","Vitality","Void"],"items":["Elytra"],"maxLevel":1,"incompatible":["Other Avatars"],"description":"While gliding, sneaking causes you to echolocate, highlighting mobs within 40 blocks and granting night vision for 10 seconds. \nWhile in light levels of 4 or less, mobs only detect you from 60-25% of their usual distance.","source":"Runecrafted","category":"Avatar","costMode":"runes"},{"name":"Avatar of Bees","runes":["Stones","Gusts","Stones","Gusts","Vitality"],"items":["Elytra"],"maxLevel":1,"incompatible":["Other Avatars"],"description":"While gliding near the ground in the overworld, you can float indefinitely. Grants +1 block reach. Prevents bees from targeting you. \nEating honey while gliding causes you to release pollen for 5 seconds, bonemealing crops below you in a 3-block radius.","source":"Runecrafted","category":"Avatar","costMode":"runes"},{"name":"Avatar of Ender Dragons","runes":["Vitality","Void","Gusts","Cinders","Arcanum"],"items":["Elytra"],"maxLevel":1,"incompatible":["Other Avatars"],"description":"While gliding, sneaking causes you to shoot a dragon fireball, and colliding with terrain causes you to warp through it to the next open space.\nWhile gliding near an Ender Crystal, you regenerate health.","source":"Runecrafted","category":"Avatar","costMode":"runes"},{"name":"Avatar of Iron Golems","runes":["Vitality","Kinesis","Aegis","Stones","Kinesis"],"items":["Chestplates"],"maxLevel":1,"incompatible":["Other Avatars"],"description":"You take -50% knockback, deal +25% knockback. Gain +2❤️ max HP.\nYou can give zombie villagers a poppy to cure them without applying Weakness.","source":"Runecrafted","category":"Avatar","costMode":"runes"},{"name":"Avatar of Phantoms","runes":["Vitality","Void","Gusts","Mortus","Gusts"],"items":["Elytra"],"maxLevel":1,"incompatible":["Other Avatars"],"description":"Every night you haven’t slept adds a Phantom to your Phantom Horde, up to 10.\nWhile gliding, colliding with an enemy deals 2-7 hearts of damage. When gliding at night, you summon your Phantom Horde, who fly with you and attack nearby enemies for the same damage.","source":"Ru ier, falling faster but dealing +2-♾️❤️ damage, increasing linearly with distance fallen.","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Bane of Arthropods","runes":[],"items":["Swords","Axes","Maces","Spears"],"maxLevel":5,"incompatible":["Exploit","Extinction","Tempo","Dynamo","Momentum","Sweet Spot","Smite","Sharpness","Breach","Density","Cleaving"],"description":"Always slows for the full duration (1.5-3.5 seconds) and works against Shulkers.","source":"Vanilla","category":"Damage","costMode":"free"},{"name":"Battering Ram","runes":["Aegis","Aegis","Kinesis","Gusts","Sparks"],"items":["Shields"],"maxLevel":1,"incompatible":["Discus","Advance"],"description":"Bashing causes you to rapidly dash forward, pushing all enemies you collide with along the dash, then stunning them for 1.5 seconds.","source":"Runecrafted","category":"Bashing","costMode":"runes"},{"name":"Beheld","runes":["Tides","Kinesis","Chills","Mortus","Sparks"],"items":["Tridents"],"maxLevel":1,"incompatible":["Cavitation","Undertow"],"description":"Upon preparing a throw, enemies you behold are briefly slowed 40%. If they are below half health, they are stunned instead.","source":"Runecrafted","category":"Control","costMode":"runes"},{"name":"Blast Protection V","runes":["Kinesis","Aegis","Kinesis","Vitality","Moments"],"items":["Helmets","Chestplates","Leggings","Boots"],"maxLevel":5,"incompatible":["Headstart","Adrenaline Rush","Equilibrium","Lizard Tail","Protection","Fire Protection","Projectile Protection"],"description":"Blasts deal -8-40% damage and -15–75% knockback.\nRunecrafting Bonus: Blasts instead deal -75% damage, then you siphon the shrapnel to form a 1❤ Absorption blast shield, granting knockback immunity and 25% damage reduction while the shield holds.","source":"Runecrafted","category":"Protection","costMode":"runes"},{"name":"Blitz","runes":["Stones","Gusts","Moments","Gusts","Gusts"],"items":["Leggings"],"maxLevel":2,"incompatible":["Walkman","Swift Snea g"],"description":"Strikes prepare a broadside cannon, up to 2-4 cannons. Thrown hits signal each cannon to fire an explosive cannonball towards enemies in the direction of the throw.","source":"Runecrafted","category":"Splashing","costMode":"runes"},{"name":"Dynamo","runes":["Gusts","Kinesis","Sparks","Sparks","Sparks"],"items":["Maces"],"maxLevel":3,"incompatible":["Extinction","Breach","Density","Sharpness","Smite","Bane of Arthropods"],"description":"Untargeted swings convert accumulated smash damage into an equivalent amount of torque. Standard mace attacks deal bonus lightning damage equal to 25-35% of torque.","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Ear Collector","runes":["Mortus","Opulence","Moments","Vitality","Opulence"],"items":["Swords"],"maxLevel":1,"incompatible":["Bounty Hunter","Looting"],"description":"This sword collects an ear stack to identify each of its victims, and upon exiting combat may attract a wandering guild trader who provides items in exchange for its ears.\n- Items: Wares include useful combat items, gems, rare gear, and other unique offers.","source":"Runecrafted","category":"Loot","costMode":"runes"},{"name":"Effervescence","runes":["Kinesis","Tides","Gusts","Tides","Moments"],"items":["Maces"],"maxLevel":3,"incompatible":["Subduction","Wind Burst"],"description":"Smash attacks release a bubble which envelops you for 4-8 seconds, blocking damage while you rise 4 blocks per second with increased aerial mobility. The bubble pops early if you sneak or it blocks 10♥️ damage.","source":"Runecrafted","category":"Boosting","costMode":"runes"},{"name":"Eldritch Inclination","runes":["Void","Kinesis","Gusts","Opulence","Moments"],"items":["Helmets"],"maxLevel":1,"incompatible":["Aqua Affinity"],"description":"When the Void damages you, it spits you back upwards and grants you 5 minutes of stacking Luck. You can anger Wardens one additional time before they unburrow.","source":"Runecrafted","category":"Affinity","costMode":"runes"},{"name":"Equilibrium","runes":["Mortus","Aegis","Aegis","Vitality","Gusts"],"items":["Helmets"],"maxLevel":1,"incompatible":["Protection","Blast Protection","Fire Protection","Projectile Protection"],"description":"You equalize for 2 seconds upon dropping to 50% health, during which you are invulnerable, gain 40% speed, and heal for 15% health. This can’t occur again until you fully heal.","source":"Runecrafted","category":"Protection","costMode":"runes"},{"name":"Executioner","runes":["Vitality","Void","Mortus","Opulence","Opulence"],"items":["Axes"],"maxLevel":1,"incompatible":["Bounty Hunter","Looting"],"description":"Charged attacks immediately execute targets left below 5% health. Executed targets are 3.5x more likely to drop their head.","source":"Runecrafted","category":"Loot","costMode":"runes"},{"name":"Exploit","runes":["Mortus","Moments","Aegis","Void","Chills"],"items":["Axes"],"maxLevel":3,"incompatible":["Extinction","Momentum","Sharpness","Bane of Arthropods","Smite"],"description":"After attacking, if you lose no health while recharging, your next attack deals +2-4 hearts of armor-piercing damage and briefly slows the target.","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Extinction","runes":["Mortus","Mortus","Mortus","Mortus","Void"],"items":["Maces","Swords","Axes","Tridents","Spears"],"maxLevel":3,"incompatible":["Tempo","Exploit","Sundering","Windup","Momentum","Dynamo","Sweet Spot","Ballast","Sharpness","Bane of Arthropods","Smite","Impaling","Breach","Density","Cleaving"],"description":"Slain entities are marked for extinction, permanently granting 1 stack. Strikes deal +0.25 hearts damage per stack against that entity type, up to +5-10 ❤. \n- \tBosses grant 4 stacks and, at max level, the bonus damage to them is uncapped. Stacks have no effect in Trials.\n\nOnly one entity type can be marked at a time. A new type can be marked by gaining 5 extinction stacks against it.","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Fencing","runes":["Mortus","Gusts","Gusts","Kinesis","Aegis"],"items":["Swords"],"maxLevel":1,"incompatible":["Ragdoll","Knockback"],"description":"After an attack, you can double-tap a movement key to hop in that direction, during which you are invulnerable.","source":"Runecrafted","category":"Control","costMode":"runes"},{"name":"Fire Aspect III","runes":["Cinders","Vitality","Void","Sparks","Cinders"],"items":["Swords","Axes","Spears"],"maxLevel":3,"incompatible":["Ice Aspect","Plague Aspect","Purity Aspect"],"description":"Attacks ignite the victim for 4-12 seconds. \nRunecrafting Bonus: Right clicks act as if a Flint and Steel were used. Cuts healing of burning targets by 50%.","source":"Runecrafted","category":"Aspect","costMode":"runes"},{"name":"Fire Protection V","runes":["Cinders","Aegis","Aegis","Cinders","Moments"],"items":["Helmets","Chestplates","Leggings","Boots"],"maxLevel":5,"incompatible":["Headstart","Adrenaline Rush","Equilibrium","Lizard Tail","Protection","Blast Protection","Projectile Protection"],"description":"Fire and lava deal 8-40% less damage and you burn for 15-75% less time. \nRunecrafting Bonus: You take -25% damage from burning enemies, and their unarmed attacks no longer ignite you.","source":"Runecrafted","category":"Protection","costMode":"runes"},{"name":"Flare","runes":["Gusts","Cinders","Cinders","Moments","Void"],"items":["Crossbows"],"maxLevel":1,"incompatible":["Snare","Smokescreen"],"description":"Landed projectiles become a flare, providing light which decays over 30 seconds. Enemies hit directly glow for 30 seconds instead.","source":"Runecrafted","category":"Contraption","costMode":"runes"},{"name":"Fling","runes":["Kinesis","Moments","Kinesis","Gusts","Sparks"],"items":["Spears"],"maxLevel":1,"incompatible":["Knockback"],"description":"The first target you charge is impaled for 2 seconds and held before you. Ending the charge flings the impaled a distance and stuns them and enemies the collide with, both based on your speed.","source":"Runecrafted","category":"Control","costMode":"runes"},{"name":"Flurry","runes":["Kinesis","Mortus","Gusts","Gusts","Gusts"],"items":["Spears"],"maxLevel":3,"incompatible":["Extinction","Precision","Sharpness","Bane of Arthropods","Smite"],"description":"Charge strikes grant +30-90% attack speed on your next 3 jabs","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Fortify","runes":["Moments","Aegis","Echoes","Vitality","Moments"],"items":["Shields"],"maxLevel":1,"incompatible":["Riposte","Voltaic"],"description":"Parries stack fortification 3 times. Once stacked, you consume them to gain 3❤️ Absorption for 3 seconds.","source":"Runecrafted","category":"Parry","costMode":"runes"},{"name":"Frost","runes":["Gusts","Echoes","Chills","Chills","Chills"],"items":["Bows"],"maxLevel":1,"incompatible":["Pestilence","Flame"],"description":"Shots apply 8 seconds of freezing, stacking with each shot and capping at 20 seconds.","source":"Runecrafted","category":"Aspect","costMode":"runes"},{"name":"Frost Walker","runes":[],"items":["Boots"],"maxLevel":2,"incompatible":["Depth Strider"],"description":"You walk 25-50% faster on ice and snow blocks, and freeze the ground beneath you in a 3-4 block radius while walking, converting powdered snow to snow and temporarily converting water to frosted ice.","source":"Vanilla","category":"Travel","costMode":"free"},{"name":"Gatling","runes":["Gusts","Mortus","Echoes","Gusts","Gusts"],"items":["Crossbows"],"maxLevel":1,"incompatible":["Tartean Hellhound","Cryovolcano"],"description":"The first loaded arrow which hits an enemy, and every other thereafter, grant +1 clip size. Firing a loaded arrow fires 1 additional arrow per clip size in a rapid, narrow barrage.","source":"Runecrafted","category":"Spread","costMode":"runes"},{"name":"Green Thumb","runes":["Stones","Vitality","Moments","Void","Vitality"],"items":["Hoes"],"maxLevel":2,"incompatible":["Schrödinger's Thumb","Dowsing Thumb"],"description":"Auto-harvesting crops automatically regrows them by 2-3 growth stages, capped at 1 below their max growth stage.\nAuto-harvesting: Right-click a fully grown crop to automatically harvest and replant it.","source":"Runecrafted","category":"Harvest","costMode":"runes"},{"name":"Ground Pound","runes":["Arcanum","Gusts","Stones","Aegis","Kinesis"],"items":["Boots"],"maxLevel":2,"incompatible":["Rocket Boosting","Feather Falling"],"description":"Fall damage is reduced by -25-50%. Double sneaking while airborne performs a rapid downward stomp. Upon landing, the shockwave deals 50% of the initial damage to enemies within 5 blocks.","source":"Runecrafted","category":"Descent","costMode":"runes"},{"name":"Hair-Trigger","runes":["Moments","Mortus","Void","Moments","Gusts"],"items":["Bows"],"maxLevel":1,"incompatible":["Strafing","Punch"],"description":"Being struck or taking fall damage while holding this bow in your main hand automatically fires a fully charged shot. Firing a damaging projectile puts Hair-Trigger on a 1-second cooldown.","source":"Runecrafted","category":"Control","costMode":"runes"},{"name":"Hands-On Learning","runes":["Stones","Vitality","Arcanum","Arcanum","Arcanum"],"items":["Hoes"],"maxLevel":1,"incompatible":["Taste Test","Mulching"],"description":"Auto-harvesting crops has a 33% chance to drop an experience orb.\nAuto-harvesting: Right-click a fully grown crop to automatically harvest and replant it.","source":"Runecrafted","category":"Surplus","costMode":"runes"},{"name":"Headstart","runes":["Vitality","Vitality","Aegis","Mortus","Gusts"],"items":["Boots"],"maxLevel":1,"incompatible":["Protection","Blast Protection","Fire Protection","Projectile Protection"],"description":"While above 75% health, you take -50% damage and gain a burst of speed when taking damage.","source":"Runecrafted","category":"Protection","costMode":"runes"},{"name":"Heraclean","runes":["Tides","Sparks","Mortus","Sparks","Opulence"],"items":["Tridents"],"maxLevel":1,"incompatible":["Channeling"],"description":"- While your world's overworld is thunderstorming, strikes that drop a boss below any 25% health threshold detonate a large, stunning tempest flare for 10♥️ lightning damage. \n- Once per thunderstorm, each boss drops a tempest chest when slain, 10% of which contain their head.","source":"Runecrafted","category":"Heroism","costMode":"runes"},{"name":"Hot Rod","runes":["Tides","Cinders","Cinders","Vitality","Opulence"],"items":["Fishing Rods"],"maxLevel":3,"incompatible":["Trawling"],"description":"This rod sears 30-50% of caught fish, doubling restored hunger and sell price, and can fish in lava, doubling the sear chance.","source":"Runecrafted","category":"Tackle","costMode":"runes"},{"name":"Howling","runes":["Mortus","Echoes","Gusts","Echoes","Mortus"],"items":["Swords","Axes"],"maxLevel":1,"incompatible":["Chainsaw","Tempest","Coup de Grâce","Sweeping Edge"],"description":"Charged attacks grant 1 stack, up to 4. At 4 stacks, right-click to consume all stacks and Howl, releasing a sonic wave that strikes enemies in a 6-block cylinder for 75% damage. If your offhand weapon is Howling, it also strikes them for 25% damage.","source":"Runecrafted","category":"Sweeping","costMode":"runes"},{"name":"Ice Aspect","runes":["Mortus","Echoes","Chills","Chills","Chills"],"items":["Maces","Swords","Axes","Spears"],"maxLevel":3,"incompatible":["Plague Aspect","Purity Aspect","Fire Aspect III","Fire Aspect"],"description":"Attacks apply 4-8 seconds of freezing, stacking with each attack and capping at 20 seconds.","source":"Runecrafted","category":"Aspect","costMode":"runes"},{"name":"Impaling","runes":[],"items":["Tridents"],"maxLevel":5,"incompatible":["Windup","Sundering","Extinction","Ballast"],"description":"Now works vs. any mob in water/rain regardless of if it's aquatic","source":"Vanilla","category":"Damage","costMode":"free"},{"name":"Impetus of Artemis","runes":["Sparks","Vitality","Gusts","Arcanum","Opulence"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"- Double sneaking calls or dismisses your chosen spirit mount, defaulting to your spirit wolf.\n- While mounted, you apply moonlight to the closest enemy. Moonlit enemies periodically glow, take +2-4♥️ magic damage from headshots, and ranged kills collect their loot and heal your mount 1♥️.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Athena","runes":["Aegis","Moments","Sparks","Stones","Mortus"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"You approach combat in 10-second battle cycles, each with 10 Aegis🛡️. You must use 1🛡️ to shoot or manually attack, or you can double tap movement keys while blocking to spend 🛡️ to execute battle actions:\n- W: (3🛡️) Enter warfare stance for 3 attacks.\n- A: (2🛡️) Stealth and prepare an ambush.\n- S: (2-4🛡️) Petrify those facing you with the Gorgon stare.\n- D: (4🛡️) Plant a decoy trap zone at the target area.\n\n- Warfare Stance: Strike in a cone behind the target, dealing +2-5❤️ base damage to all targets scaling with how unarmored each target is.\n- Ambush: Stealth and gain 20% speed for 3 seconds. If you exit stealth by attacking, you critically strike for 1.5x base damage and shred 50% of the target's armor for 5 seconds.\n- Stare: Stuns for 3 seconds, costing 2-4🛡️ for 1-3+ affected enemies. Players always cost 3🛡. Attacks which break petrification deal +2-5❤️ executing base damage, +2❤️ per parry this battle cycle.\n- Decoy Trap Zone: A temporary 4x4 zone centered on a 5❤️ decoy which is hidden from other players and attracts mobs. Enemies who enter the zone or hit the decoy are parried and automatically attacked by you, ignoring the range.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Dionysus","runes":["Tides","Vitality","Sparks","Opulence","Moments"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"- You can hand-brew potions by inserting water or ingredients into bottles.\n- Your potions cause their targets drunken revelry, starting a happy hour if applied repeatedly, during which 50% of used potions are not consumed.\n    - Drunken Revelry: Grants +1❤️ attack damage for 10 seconds, nauseating briefly if applied to yourself or for the full duration if applied to enemies. Nauseated mobs randomly lose focus upon attacking and fire projectiles inaccurately.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Hades","runes":["Void","Sparks","Void","Mortus","Arcanum"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"- While sneaking, enemies only detect you while within 10 blocks and facing you.\n- You can double sneak while undetected or out of enemy sight to enter chthonic form for 4 seconds. Strikes that end chthonic form critically strike and deal +6♥️ magic damage.\n    - Chthonic Form: Stealth by descending into shadows, gaining +50% speed and +1 step height. Stealths end upon using items or dealing direct damage.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Hecate","runes":["Echoes","Arcanum","Sparks","Moments","Arcanum"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"You have dominion over past, present, and future, granting the following spell effects:\n- Past: You reflect after every 3rd spell cast, causing your next spell tome swing to recast your last spell at no XP cost.\n- Present: You gain 25% runic spell power, and magic weapon kills collect loot and XP.\n- Future: You can sneak swing a spell tome to scry, casting its rightmost spell regardless of your current selection.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Hephaestus","runes":["Stones","Cinders","Sparks","Opulence","Kinesis"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"You can hand-forge artisan weapons using up to 2 materials and 1 gem. They're unenchantable and low durability, but deal high damage, apply bonus effects per-component, and 🔨strike the iron every 10th hit, amplifying effects in +2 radius:\n- Gem: Stacks the gem's stat upon 🔨striking the iron.\n- Wood: Attacks 20% faster or 🔨50% faster for 5 seconds.\n- Stone: Attacks stun briefly or 🔨for 2 seconds.\n- Gold: Kills drop +3x of 🔨+5x loot.\n- Iron: Chains 2❤️ volcanic lightning or 🔨an 8❤️ eruption.\n- Diamond: 🔨Striking the iron stacks forged gems stats twice.\n- Netherite: 3x durability. Can forge with 3 materials/gems.\n\n- Hand-forge: Right-click a weapon material onto a stick in your inventory to forge a sword, or shift-right-click to forge an axe. Further materials and gems can be right-clicked onto an artisan weapon to forge them in. Forged gems are dropped when the weapon breaks.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Hermes","runes":["Sparks","Void","Mortus","Moments","Void"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"Upon blinking, you engage in divine trickery, a brief stealth that empowers your next attack +2♥️, and create a shortcut for 4 seconds that you can enter once to return to the other end. If the shortcut expires unused, you engage in divine trickery once more.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Poseidon","runes":["Stones","Sparks","Tides","Kinesis","Mortus"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"- You can riptide while grounded without being wet.\n- Whenever your riptide, you ride the wave, always traveling the full distance, at constant speed, and with full control of your direction, striking all nearby enemies along the way.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Impetus of Zeus","runes":["Gusts","Sparks","Moments","Gusts","Sparks"],"items":["Leggings"],"maxLevel":1,"incompatible":["Other Impetuses"],"description":"While gliding, you gather static charge, and temporarily slow down while aiming ranged weapons. At full charge, your next fired projectile becomes lightning.\n- Becomes Lightning: Lightning projectiles gain trueshot and strike lightning upon colliding. If it strikes an enemy, the lightning deals the same damage as the projectiles.","source":"Runecrafted","category":"Impetus","costMode":"runes"},{"name":"Kaleidoscope","runes":["Cinders","Void","Arcanum","Moments","Void"],"items":["Spyglass"],"maxLevel":1,"incompatible":[],"description":"Viewing a portal through this spyglass instantly transports you through it.","source":"Runecrafted","category":"Uncategorized","costMode":"runes"},{"name":"Kindle Touch","runes":["Arcanum","Stones","Cinders","Cinders","Cinders"],"items":["Pickaxes","Axes","Shovels"],"maxLevel":1,"incompatible":["Silk Touch"],"description":"Mined blocks drop the smelted version of the block instead of their normal drops.","source":"Runecrafted","category":"Uncategorized","costMode":"runes"},{"name":"Lizard Tail","runes":["Mortus","Void","Vitality","Gusts","Moments"],"items":["Leggings"],"maxLevel":1,"incompatible":["Protection","Projectile Protection","Blast Protection","Fire Protection"],"description":"You survive death at 0.5 hearts, cleansing negative effects and shedding a decoy tail which draws in distractible enemies for 10 seconds, during which you stealth and gain 80% speed. This can’t occur again until you fully heal.","source":"Runecrafted","category":"Protection","costMode":"runes"},{"name":"Loyalty","runes":[],"items":["Tridents"],"maxLevel":3,"incompatible":["Riptide"],"description":"Returns earlier and at a faster speed. Returns even if it falls in the void.","source":"Vanilla","category":"Uncategorized","costMode":"free"},{"name":"Magnetism","runes":["Stones","Kinesis","Arcanum","Kinesis","Opulence"],"items":["Pickaxes","Axes","Shovels","Shears","Hoes"],"maxLevel":1,"incompatible":["Aftershock"],"description":"Drops from mined blocks are placed directly in your inventory. When mining an ore, the resources are siphoned from the entire vein, leaving behind cobbled blocks.","source":"Runecrafted","category":"Excavation","costMode":"runes"},{"name":"Man-Eater","runes":[],"items":["Spears"],"maxLevel":null,"incompatible":["Vault","Skip","Lunge"],"description":"Charges forcibly dash to Charybdis, briefly liquefying terrain. Jabs near the whirlpool pull in enemies and execute at 10% HP, sating 1 hunger.","source":"Mythical","category":"Dash","costMode":"free"},{"name":"Marking","runes":["Vitality","Moments","Arcanum","Gusts","Kinesis"],"items":["Spyglass"],"maxLevel":1,"incompatible":["Shrink Ray"],"description":"Creatures view through this spyglass for 1 second glow and become magically tracked. Projectiles home in on tracked entities.","source":"Runecrafted","category":"Focus","costMode":"runes"},{"name":"Mitosis","runes":["Vitality","Arcanum","Arcanum","Vitality","Vitality"],"items":["Shears"],"maxLevel":1,"incompatible":["Tithing","Wire Cutters"],"description":"Adult entities with baby forms can be sheared to split them into two babies.","source":"Runecrafted","category":"Cutting","costMode":"runes"},{"name":"Momentum","runes":["Moments","Mortus","Echoes","Mortus","Gusts"],"items":["Axes"],"maxLevel":3,"incompatible":["Extinction","Exploit","Sharpness","Smite","Bane of Arthropods"],"description":"Well-timed attacks deal +1❤️ damage and stack momentum, stacking infinitely for +4-8% attack speed per stack.","source":"Runecrafted","category":"Damage","costMode":"runes"},{"name":"Mulching","runes":["Stones","Vitality","Opulence","Vitality","Stones"],"items":["Hoes"],"maxLevel":1,"incompatible":["Taste Test","Hands-On Learning"],"description":"Surplus seeds and poisonous potatoes dropped by harvested crops are automatically composted.","source":"Runecrafted","category":"Surplus","costMode":"runes"},{"name":"Multishot","runes":[],"items":["Crossbows"],"maxLevel":1,"incompatible":["Piercing"],"description":"Projectiles bypass invulnerability frames.","source":"Vanilla","category":"Uncategorized","costMode":"free"},{"name":"Noclip","runes":["Gusts","Gusts","Stones","Void","Gusts"],"items":["Boots"],"maxLevel":1,"incompatible":["Coyote Time","Soul Speed"],"description":"While sprinting, you can warp through 1-block thick walls.","source":"Runecrafted","category":"Traversal","costMode":"runes"},{"name":"Paradigm of Acedia","runes":["Arcanum","Void","Arcanum","Vitality","Mortus"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"Your tames’ and summons’ attacks benefit from combat enchantments on your held melee weapon, but your attacks no longer do.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Envy","runes":["Void","Arcanum","Opulence","Vitality","Void"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"An item with a different Paradigm can be inserted into this one to gain only its positive effects, but your maximum health is reduced by 40%.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Gluttony","runes":["Opulence","Void","Moments","Opulence","Void"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"Your hunger bar acts as an additional secondary health bar, but consumed food is at best as filling as bread. \nOn-Equip: Consume half of your current hunger.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Greed","runes":["Opulence","Vitality","Aegis","Moments","Mortus"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"You can form lifelong contracts with humanoids with raw gold, but if ever you don’t re-up their contract, they betray you.\nContracts: Contractors gain vanishing, unbreakable golden copies of your gear, reset to their standard max health, and unshakably follow you between worlds. You can contract 4 creatures, but not those with keywords.\nBetrayal: Contractors who betray you gain attack damage, speed, knockback resistance, and their contract cannot be resumed.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Lust","runes":["Vitality","Mortus","Cinders","Moments","Mortus"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"Enemies targeting a nearby spouse are scorned, letting you lunge at them from afar, but if a spouse dies in combat you wither away unless you enact reckless vengeance against their killer.\nScorned: \n- Swing at them while within 32 blocks to lunge. \n- Your first strike sates 1 hunger and grants 50% attack speed for 7 seconds. - Your strikes heal the targeted spouse for 15% of damage dealt. \nReckless Vengeance: Gain +20% speed toward the target. You can only have one vengeance target at a time. The wither is only cleansed upon killing your target.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Pride","runes":["Aegis","Aegis","Aegis","Aegis","Mortus"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"You ignore the first 1-5 hits from each enemy, but you take double damage from them otherwise.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Sloth","runes":["Gusts","Chills","Mortus","Kinesis","Chills"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"You can lumber, moving 10% slower and gaining slow, massive attacks, but lumbering replaces sprinting.\nYou can perform massive attacks after sprinting for 1.5 seconds. They have -66% total attack speed but strike on any swing in a 5-block radius, applying 2.5x damage and a brief stun then 1 second of -20% speed.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Vainglory","runes":["Kinesis","Void","Mortus","Mortus","Gusts"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"Your swings fire as piercing waves, and you can hover at full health, but you strike yourself, bypassing armor, when your waves miss.\n\nWaves: Weapons with lower attack speed fire wider waves and ones with higher range fire faster moving waves.\n\nHover: Swing directly up to toggle the hover. It disables once you witness your health fall below full.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Paradigm of Wrath","runes":["Mortus","Cinders","Mortus","Moments","Mortus"],"items":["Helmets"],"maxLevel":1,"incompatible":["Other Paradigms"],"description":"You swing becomes a rapid onslaught using all melee hotbar weapons, but your hotbar must all be melee weapons for strikes to land.\nOnslaught swings your weapons in sequence at 2x speed, ignoring mercy frames on landed hits.","source":"Runecrafted","category":"Paradigm","costMode":"runes"},{"name":"Pestilence","runes":["Gusts","Echoes","Mortus","Tides","Mortus"],"items":["Bows"],"maxLevel":1,"incompatible":["Frost","Flame"],"description":"Shots Plague enemies for 4-8 seconds. Plagued enemies have Wither I and on death will spread Plague stacks to the 1-3 closest enemies after a short delay.","source":"Runecrafted","category":"Aspect","costMode":"runes"},{"name":"Pestle","runes":["Mortus","Kinesis","Stones","Opulence","Stones"],"items":["Maces"],"maxLevel":1,"incompatible":["Looting"],"description":"Slain enemies have a chance, scaling with overkill damage, to be crushed into primordial dust, which can be crafted with crystals and socketing gems to duplicate them.","source":"Runecrafted","category":"Loot","costMode":"runes"},{"name":"Pilot Light","runes":["Stones","Kinesis","Cinders","Cinders","Cinders"],"items":["Flint and Steel"],"maxLevel":1,"incompatible":[],"description":"Right clicking on Furnaces, Blast Furnaces, and   const root = document.getElementById('runecrafting-planner');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';
  const $ = (id) => root.querySelector('#' + id);
  const runeNames = ['Aegis','Arcanum','Chills','Cinders','Echoes','Gusts','Kinesis','Moments','Mortus','Opulence','Sparks','Stones','Tides','Vitality','Void'];
  const state = { items: [], nextId: 1 };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDescription = value => esc(value || 'No description available yet.')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const makeOptions = (list, selected, placeholder) =>
    (placeholder ? `<option value="">${esc(placeholder)}</option>` : '') +
    list.map(v => `<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('');
  // Equipment categories apply to both Add Equipment and Change Equipment.
  // Items not yet categorized in this version appear in Other Equipment.
  const equipmentGroups = [
    ['Armor', ['Helmets','Chestplates','Leggings','Boots','Elytra','Shields']],
    ['Weapons', ['Swords','Axes','Spears','Maces','Tridents','Bows','Crossbows']],
    ['Tools', ['Pickaxes','Shovels','Hoes','Fishing Rods','Shears','Flint and Steel','Spyglass','Goat Horns']]
  ];
  const makeEquipmentOptions = (items, selected) => {
    const known = new Set();
    const html = equipmentGroups.map(([label, types]) => {
      const available = types.filter(type => items.includes(type));
      available.forEach(type => known.add(type));
      return available.length ? `<optgroup label="${esc(label)}">${makeOptions(available,selected)}</optgroup>` : '';
    }).join('');
    const other = items.filter(type => !known.has(type));
    return html + (other.length ? `<optgroup label="Other Equipment">${makeOptions(other,selected)}</optgroup>` : '');
  };
  // Group the native dropdown by the Category field, while preserving the original enchantment name as its value.
  const categoryName = e => (e?.category || '').trim() || 'Uncategorized';
  const makeEnchantOptions = (list, selected) => {
    const groups = new Map();
    list.forEach(e => {
      const category = categoryName(e);
      if (!groups.has(category)) groups.set(category, []);
      groups.get(category).push(e);
    });

      if (!e) return;
      if (e.costMode === 'free') { free.push(e.name); return; }
      e.runes.forEach(r=>totals[r]=(totals[r]||0)+runeMultiplier(e,entry));
    }));
    const lines=['Runecrafting rune & gem shopping list',...runeNames.filter(r=>totals[r]>0).map(r=>`${r}: ${totals[r]}`)];
    if (free.length) lines.push('', 'No rune cost: ' + free.join(', '));
    const gems=gemCounts();lines.push('','Gems',...GEMS.filter(g=>gems[g.name]).map(g=>`${g.name}: ${gems[g.name]}`));
    if (!Object.values(gems).some(Boolean))lines.push('No gems planned.');
    const text=lines.join('\n');
    const status=$('rcp-copy-status');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(()=>status.textContent='Rune & gem list copied!').catch(()=>fallbackCopy(text,status));
    } else fallbackCopy(text,status);
  });
  function fallbackCopy(text,status) {
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); status.textContent='Rune & gem list copied!'; } catch(e) { status.textContent='Copy was blocked by your browser. You can select and copy the totals manually.'; }
    ta.remove();
  }
  render();
  window.SSSHubData.fetch()
    .then(async response => { if (!response.ok) throw new Error('Live data unavailable'); return response.json(); })
    .then(live => {
      if (!Array.isArray(live.enchantments) || !Array.isArray(live.items)) throw new Error('Unexpected data');
      DATA = live;
      enchantByName.clear();
      DATA.enchantments.forEach(e=>enchantByName.set(e.name.toLowerCase(),e));
      state.items.forEach(item => { item.enchants = item.enchants.filter(entry => !entry.name || DATA.enchantments.some(e => e.name===entry.name && e.items.includes(item.type))); });
      render();
      console.info('Runecrafting Planner: '+(live._dataSource==='live'?'live data':'bundled reference data')+' loaded');
    })
    .catch(error => { console.warn('Runecrafting Planner: using bundled backup data', error); });
})();
</script>
